<!doctype html>
<html lang="bn">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>বিস্তারিত তথ্য</title>
	<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
	<link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
	<style>
		:root { color-scheme: light dark; }
		html { scroll-behavior: smooth; }
		body { margin:0; font-family:'Kalpurush','Hind Siliguri', system-ui, Arial, sans-serif; background:#f6f7f9; color:#111; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden; }
		header { position:sticky; top:0; background:#fff; border-bottom:1px solid #e5e7eb; z-index:10; }
		.container { max-width:900px; margin:0 auto; padding:1rem; }
		h1 { margin:.25rem 0; font-size:1.15rem; text-align:center; }
		.toolbar { display:flex; gap:.6rem; align-items:center; justify-content:center; flex-wrap:wrap; margin:.4rem 0 .8rem; }
		/* Admission form box styling */
		.form-box { background:#fff; border:2px solid #f97316; border-radius:14px; box-shadow:0 10px 30px rgba(249,115,22,.12); padding:1.1rem 1.2rem 1.25rem; }
		.image-container { text-align:center; margin-bottom:1rem; }
		.student-image { max-width:105px; max-height:140px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.15); /* reduced to 70% (30% smaller) */
			/* 4px orange stroke */
			outline: 2px solid #f97316; /* fallback for older browsers */
			box-shadow: 0 4px 12px rgba(0,0,0,.15), 0 0 0 4px rgba(249,115,22,0.05) inset;
		}
		.form-head { display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; margin:0 0 .8rem; border-bottom:2px solid #e5e7eb; padding-bottom:.5rem; }
		.form-title { margin:0; font-size:1.2rem; letter-spacing:.4px; }
		.form-meta { margin:0; font-size:.82rem; color:#64748b; text-align:right; }
	dl { display:grid; grid-template-columns: 240px 1fr; column-gap:1rem; row-gap:.12rem; margin:0; }
		dt { font-weight:800; color:#374151; align-self:center; }
		dt::after { content:' :'; font-weight:400; color:#9ca3af; }
	dd { margin:0; color:#111; padding: .06rem 0 .1rem; border-bottom:1px solid #cbd5e1; min-height:0.9rem; word-break: break-word; }
	/* Group header style: centered and bold, full-width within the form box (reduced spacing) */
	.group-header { grid-column: 1 / -1; text-align:center; font-weight:800; padding:.18rem 0; margin:.08rem 0; border-bottom:1px solid transparent; font-size:1rem; text-decoration: underline; text-underline-offset: 2px; }
		.actions { display:flex; gap:.6rem; justify-content:center; margin-top:1rem; }
		.btn { display:inline-block; padding:.5rem .8rem; border:1px solid #d0d7de; border-radius:8px; background:#fff; text-decoration:none; color:#111; font-size:.85rem; cursor:pointer; }
		.btn:hover { background:#f3f4f6; }
		.muted { color:#6b7280; font-size: 0.85rem; }
		.back-btn { 
			display: inline-flex; 
			align-items: center; 
			gap: 0.4rem; 
			padding: 0.4rem 0.7rem; 
			background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
			color: white;
			border: none;
			border-radius: 8px;
			text-decoration: none;
			font-size: 0.82rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
		}
		.back-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
		}
		
		/* Mobile Responsive Styles */
		@media (max-width: 768px) {
			.container { padding: 0.75rem; }
			h1 { font-size: 1rem; }
			.form-box { padding: 0.9rem; border-radius: 10px; }
			.form-head { flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; }
			.form-title { font-size: 1.05rem; }
			.form-meta { text-align: center; font-size: 0.78rem; }
			.image-container { margin-bottom: 0.8rem; }
			.student-image { max-width: 90px; max-height: 120px; }
			
			/* Keep grid layout but adjust for mobile */
			dl { 
				display: grid;
				grid-template-columns: 110px 1fr;
				column-gap: 0.6rem;
				row-gap: 0.15rem;
			}
			
			dt { 
				font-weight: 700; 
				font-size: 0.78rem;
				color: #f97316;
				align-self: center;
			}
			
			dd { 
				padding: 0.25rem 0.4rem; 
				background: #fef3c7;
				border-radius: 4px;
				border-left: 3px solid #f97316;
				font-size: 0.82rem;
				min-height: 1.4rem;
				display: flex;
				align-items: center;
			}
			
			.group-header { 
				font-size: 0.9rem; 
				padding: 0.4rem 0;
				margin: 0.4rem 0 0.2rem;
				background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
				color: white;
				border-radius: 6px;
				text-decoration: none;
			}
			
			.btn { 
				padding: 0.65rem 1.2rem; 
				font-size: 0.9rem;
				width: 100%;
				max-width: 250px;
			}
			
			.toolbar {
				flex-wrap: wrap;
				gap: 0.5rem;
				margin: 0.3rem 0 0.6rem;
			}
			
			.back-btn {
				font-size: 0.78rem;
				padding: 0.45rem 0.8rem;
			}
			
			.actions {
				margin-top: 0.8rem;
			}
			
			.muted {
				font-size: 0.75rem;
			}
		}
		
		/* Tablet view */
		@media (min-width: 769px) and (max-width: 1024px) {
			dl { 
				grid-template-columns: 200px 1fr; 
				column-gap: 0.8rem;
			}
			.form-box { padding: 1rem; }
		}
		
		/* Small mobile devices */
		@media (max-width: 480px) {
			.container { padding: 0.5rem; }
			.form-box { padding: 0.7rem; }
			h1 { font-size: 0.95rem; }
			.form-title { font-size: 1rem; }
			
			dl {
				grid-template-columns: 95px 1fr;
				column-gap: 0.5rem;
				row-gap: 0.12rem;
			}
			
			dt { font-size: 0.72rem; }
			dd { font-size: 0.78rem; padding: 0.2rem 0.35rem; min-height: 1.3rem; }
			.group-header { font-size: 0.85rem; padding: 0.35rem 0; }
		}
		@media print {
			@page { margin:0.3cm; }
			header, .no-print { display:none; }
			body { background:#fff; }
			.container { max-width:100%; padding:0; }
			.form-box { box-shadow:none; border-color:#000; }
			.form-head { border-bottom-color:#000; }
			dl { row-gap:.4rem; }
			dd { border-bottom-color:#000; }
		}
		@media (prefers-color-scheme: dark){
			body { background:#0b1020; color:#e5e7eb; }
			header, .form-box { background:#111729; border-color:#075985; }
			.form-head { border-bottom-color:#263148; }
			dt { color:#cbd5e1; } dd { color:#e5e7eb; border-bottom-color:#334155; }
			dt::after { color:#94a3b8; }
			.btn { background:#111729; color:#e5e7eb; border-color:#263148; }
			.btn:hover { background:#0f162a; }
		}
		
		/* Dark mode mobile adjustments */
		@media (max-width: 768px) and (prefers-color-scheme: dark) {
			dt { color:#fbbf24; }
			dd { 
				background: #1e293b;
				border-left-color: #fbbf24;
				color: #e5e7eb;
			}
			.group-header {
				background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
			}
		}
	</style>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="auth-check.js"></script>
	<script type="module" src="./dist/detailsinfo.js"></script>

</head>
<body>
	<header>
		<div class="container">
			<h1 id="head">বিস্তারিত তথ্য</h1>
			<div class="toolbar">
				<a href="javascript:history.back()" class="back-btn">
					<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M19 12H5M12 19l-7-7 7-7"/>
					</svg>
					ফিরে যান
				</a>
				<span id="status" class="muted"></span>
			</div>
		</div>
	</header>
	<main>
		<div class="container">
			<div class="form-box">
				<div class="form-head">
					<h2 class="form-title">ভর্তি ফরম</h2>
					<p class="form-meta" id="meta"></p>
				</div>
				<div id="image-container" class="image-container"></div>
				<dl id="dl"></dl>
				<hr>
				<div class="actions no-print">
					<button class="btn" onclick="window.print()">Print</button>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
