<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <title>Class Photos - Teacher Dashboard</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: #fdfdfd; background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px); background-size: 20px 20px; color: #1e293b; padding: 16px; min-height: 100vh; }

    .container { max-width: 1000px; margin: 0 auto; }

    /* Header Styles */
    .header {
      background: white;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      color: #0f172a;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 i { color: #667eea; font-size: 20px; }

    .back-btn {
      background: #f1f5f9;
      color: #475569;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.23s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .back-btn:hover { background: #e2e8f0; transform: translateX(-3px); }

    .class-info {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 20px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.15);
    }

    .class-info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0.95;
    }
    .class-info-item i { opacity: 0.8; font-size: 14px; }
    .class-info-item strong { font-weight: 700; margin-right: 2px; }

    /* Loading Spinner */
    .loading {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100vh; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #fdfdfd; z-index: 1000;
    }
    .spinner {
      border: 3px solid #f1f5f9; border-top: 3px solid #667eea; border-radius: 50%;
      width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Content Area */
    .content { margin-bottom: 30px; }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .total-count {
      color: #64748b;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .total-count i { color: #10b981; }

    .print-btn {
      background: white;
      color: #64748b;
      border: 1px solid #e2e8f0;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }
    .print-btn:hover { background: #f8faff; border-color: #cbd5e0; transform: translateY(-1px); }

    /* Photo Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }
    @media (min-width: 600px) {
      .photo-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    @media (min-width: 900px) {
      .photo-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
    }

    .photo-card {
      background: white;
      border: 1px solid rgba(226, 232, 240, 0.6);
      border-radius: 20px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
      animation: fadeInUp 0.5s ease-out backwards;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .photo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      border-color: rgba(102, 126, 234, 0.2);
    }

    .photo-wrapper {
      width: 90px;
      height: 110px;
      margin: 0 auto 12px;
      border-radius: 14px;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .photo-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .photo-card:hover .photo-wrapper img { transform: scale(1.1); }

    .photo-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 40px; color: #cbd5e0; background: #f1f5f9;
    }

    .student-iid {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .student-name {
      font-size: 14px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      min-height: 38px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .student-roll {
      font-size: 18px;
      color: #1e293b;
      font-weight: 900;
      background: #f1f5f9;
      padding: 4px 12px;
      border-radius: 10px;
      display: inline-block;
    }

    .roll-text { font-size: 10px; color: #94a3b8; font-weight: 700; margin-right: 4px; text-transform: uppercase; vertical-align: middle; }

    /* Pagination */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 30px;
    }

    .page-btn {
      background: white; border: 1px solid #e2e8f0; color: #64748b;
      width: 40px; height: 40px; border-radius: 10px;
      font-weight: 700; font-size: 14px;
      cursor: pointer; transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center;
    }

    .page-btn:hover:not(:disabled) { border-color: #667eea; color: #667eea; background: #f8faff; transform: translateY(-1px); }
    .page-btn.active { background: #667eea; color: white; border-color: #667eea; box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Empty State */
    .empty-state {
      text-align: center; padding: 60px 20px; color: #94a3b8;
      background: white; border-radius: 24px; border: 1px dashed #e2e8f0;
    }
    .empty-state i { font-size: 60px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 { font-size: 20px; color: #475569; margin-bottom: 8px; }

    @media print {
      body { background: white; padding: 0; }
      .header, .back-btn, .print-btn, .pagination { display: none; }
      .photo-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 15px !important; }
      .photo-card { box-shadow: none !important; border: 1px solid #eee !important; break-inside: avoid; }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 22px;
      }

      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
      }

      .photo-wrapper {
        width: 80px;
        height: 120px;
      }

      .content {
        padding: 20px;
      }

      .pagination {
        gap: 5px;
      }

      .page-btn {
        padding: 8px 12px;
        min-width: 40px;
        font-size: 14px;
      }
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .header, .back-btn, .print-btn, .pagination {
        display: none;
      }

      .content {
        box-shadow: none;
      }

      .photo-card {
        break-inside: avoid;
      }
    }
    /* Image Lightbox Modal */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      cursor: zoom-out;
      padding: 20px;
    }
    .image-modal.active { display: flex; animation: fadeIn 0.3s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .image-modal-content {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 6px solid white;
      background: white;
      animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      object-fit: contain;
    }
    @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .modal-close {
      position: absolute;
      top: 30px; right: 30px;
      width: 44px; height: 44px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #0f172a;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      z-index: 2001;
    }
    .modal-close:hover { transform: rotate(90deg) scale(1.1); background: #f1f5f9; }

    .modal-caption {
      position: absolute;
      bottom: 40px; left: 0; width: 100%;
      color: white; text-align: center;
      font-size: 20px; font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <!-- Image Lightbox Modal -->
  <div id="imageModal" class="image-modal">
    <span class="modal-close">&times;</span>
    <img id="modalImg" class="image-modal-content" src="" alt="Enlarged Photo">
    <div id="modalCaption" class="modal-caption"></div>
  </div>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Loading Students...</span>
  </div>

  <div id="mainContent" style="display: none;">
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="header-top">
          <h1><i class="fas fa-images"></i> Class Photos</h1>
          <a href="teacher_dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
          </a>
        </div>
        <div class="class-info">
          <div class="class-info-item">
            <i class="fas fa-school"></i>
            <strong>Class:</strong> <span id="displayClass">-</span>
          </div>
          <div class="class-info-item">
            <i class="fas fa-users"></i>
            <strong>Section:</strong> <span id="displaySection">-</span>
          </div>
          <div class="class-info-item">
            <i class="fas fa-user-graduate"></i>
            <strong>Teacher:</strong> <span id="displayTeacher">-</span>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="content-header">
          <div class="total-count">
            <i class="fas fa-user-check"></i>
            Total Students: <strong id="totalStudents">0</strong>
          </div>
          <button class="print-btn" onclick="window.print()">
            <i class="fas fa-print"></i>
            Print Photos
          </button>
        </div>

        <!-- Photo Grid -->
        <div id="photoGrid" class="photo-grid">
          <!-- Photos will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fas fa-image"></i>
          <h3>No Students Found</h3>
          <p>There are no students assigned to this class and section.</p>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination">
          <!-- Pagination will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Auth Check Script -->
  <script src="auth-check.js"></script>

  <script type="module" src="./dist/class_photo.js"></script>

</body>
</html>
