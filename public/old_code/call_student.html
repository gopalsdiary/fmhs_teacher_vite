<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <title>Call Students - Teacher Dashboard</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: #fffaf5; background-image: radial-gradient(#ffe6d5 0.5px, transparent 0.5px); background-size: 20px 20px; color: #374151; padding: 16px; min-height: 100vh; }

    .container { max-width: 1000px; margin: 0 auto; }

    /* Header Styles */
    .header {
      background: white;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(255, 107, 53, 0.1);
      border: 1px solid #ffedd5;
    }

    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }

    .header h1 {
      color: #7c2d12; font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 10px;
    }
    .header h1 i { color: #f97316; font-size: 18px; }

    .back-btn {
      background: #fff7ed; color: #9a3412; border: 1px solid #ffedd5; padding: 10px 18px;
      border-radius: 12px; font-weight: 700; font-size: 13px;
      cursor: pointer; transition: all 0.23s ease;
      display: flex; align-items: center; gap: 8px; text-decoration: none;
    }
    .back-btn:hover { background: #ffedd5; transform: translateX(-3px); }

    .class-info {
      background: linear-gradient(135deg, #f97316 0%, #fb923c 100%);
      color: white; padding: 16px 20px; border-radius: 18px;
      display: flex; justify-content: space-between; gap: 15px; flex-wrap: wrap;
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.2);
    }
    .class-info-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; opacity: 1; }
    .class-info-item strong { font-weight: 700; margin-right: 2px; color: #fff; }

    /* Loading Spinner */
    .loading {
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      height: 100vh; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fffaf5; z-index: 1000;
    }
    .spinner { border: 3px solid #ffedd5; border-top: 3px solid #f97316; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Content Area */
    .content { margin-bottom: 30px; }
    .content-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 4px; gap: 15px; flex-wrap: wrap; }

    .total-count { color: #ea580c; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; background: #ffedd5; padding: 8px 16px; border-radius: 12px; }
    .total-count i { color: #f97316; }

    .search-box { position: relative; flex-grow: 1; max-width: 350px; }
    .search-box input {
      width: 100%; padding: 10px 40px 10px 16px; border: 2px solid #ffedd5; border-radius: 14px;
      font-size: 14px; transition: all 0.2s ease; background: white;
    }
    .search-box input:focus { outline: none; border-color: #f97316; box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1); }
    .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #fdba74; font-size: 14px; }

    /* Student Cards (Mobile View Refined) */
    .student-cards { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 600px) { .student-cards { grid-template-columns: repeat(2, 1fr); gap: 16px; } }

    .student-card {
      background: white; border-radius: 20px; padding: 16px;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.05);
      border: 1px solid #ffedd5;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative; overflow: hidden;
      animation: fadeInUp 0.5s ease-out backwards;
    }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .student-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(249, 115, 22, 0.1); border-color: #fca5a5; }

    .card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #fed7aa;
    }

    .name-section { flex: 1; margin-right: 10px; }
    .card-name { font-size: 15px; font-weight: 800; color: #7c2d12; text-transform: uppercase; line-height: 1.2; margin-bottom: 2px; }
    .card-father { font-size: 11px; color: #9a3412; font-weight: 600; opacity: 0.8; }

    .card-roll {
      background: linear-gradient(135deg, #ffedd5 0%, #ffdbb5 100%); color: #ea580c; padding: 6px 12px; border-radius: 10px;
      font-weight: 900; font-size: 15px; min-width: 48px; text-align: center; border: 1px solid #fed7aa;
    }

    .card-body { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
    
    .card-row { display: flex; align-items: center; gap: 10px; }
    .card-label { font-size: 10px; color: #ea580c; font-weight: 700; text-transform: uppercase; width: 60px; }
    .card-value { font-size: 14px; color: #431407; font-weight: 700; flex: 1; }

    .card-actions { display: flex; gap: 10px; }
    
    .call-btn, .whatsapp-btn {
      flex: 1; padding: 10px; border: none; border-radius: 12px;
      font-weight: 700; font-size: 13px; cursor: pointer;
      transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 6px;
      text-decoration: none;
    }

    .call-btn { background: #059669; color: white; box-shadow: 0 4px 10px rgba(5, 150, 105, 0.2); }
    .call-btn:hover { background: #047857; transform: translateY(-1px); }

    .whatsapp-btn { background: #f97316; color: white; box-shadow: 0 4px 10px rgba(249, 115, 22, 0.2); }
    .whatsapp-btn:hover { background: #ea580c; transform: translateY(-1px); }

    .card-no-mobile {
      text-align: center; padding: 10px; color: #dc2626; font-weight: 700; font-size: 12px;
      background: #fef2f2; border: 1px solid #fee2e2; border-radius: 12px; width: 100%;
    }

    /* Desktop Table Styles */
    .student-table-wrapper { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #ffedd5; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.05); }
    .student-table { width: 100%; border-collapse: collapse; }
    .student-table th { background: #fff7ed; padding: 16px; text-align: left; font-size: 12px; font-weight: 700; color: #9a3412; text-transform: uppercase; border-bottom: 2px solid #ffedd5; }
    .student-table td { padding: 16px; font-size: 14px; color: #431407; border-bottom: 1px solid #fff7ed; }
    .student-table tr:hover { background: #fffcf9; }
    .student-table .roll-badge { background: #ffedd5; color: #ea580c; padding: 6px 12px; border-radius: 8px; font-weight: 800; border: 1px solid #fed7aa; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 30px; }
    .page-btn { background: white; border: 1.5px solid #ffedd5; color: #9a3412; width: 40px; height: 40px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; }
    .page-btn.active { background: #f97316; color: white; border-color: #f97316; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }

    /* Responsive Design */
    @media (max-width: 768px) {
      .student-table-wrapper { display: none; }
      .student-cards { display: grid; }
    }
    @media (min-width: 769px) {
      .student-table-wrapper { display: block; }
      .student-cards { display: none; }
    }
    
    /* Empty State */
    .empty-state { text-align: center; padding: 60px 20px; color: #9a3412; background: white; border-radius: 24px; border: 1px dashed #fed7aa; }
    .empty-state i { font-size: 60px; margin-bottom: 16px; opacity: 0.5; color: #f97316; }
    .empty-state h3 { font-size: 20px; color: #7c2d12; margin-bottom: 8px; }

    /* Mobile Detail View specifically */
    .card-label i { color: #f97316; width: 14px; }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>লোড হচ্ছে...</span>
  </div>

  <div id="mainContent" style="display: none;">
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="header-top">
          <h1>
            <i class="fas fa-phone-alt"></i>
            ছাত্র-ছাত্রীদের সাথে যোগাযোগ
          </h1>
          <a href="teacher_dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            ড্যাশবোর্ডে ফিরুন
          </a>
        </div>
        <div class="class-info">
          <div class="class-info-item">
            <i class="fas fa-school"></i>
            <strong>শ্রেণি:</strong> <span id="displayClass">-</span>
          </div>
          <div class="class-info-item">
            <i class="fas fa-users"></i>
            <strong>শাখা:</strong> <span id="displaySection">-</span>
          </div>
          <div class="class-info-item">
            <i class="fas fa-user-tie"></i>
            <strong>শিক্ষক:</strong> <span id="displayTeacher">-</span>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="content-header">
          <div class="total-count">
            <i class="fas fa-user-graduate"></i>
            মোট ছাত্র-ছাত্রী: <strong id="totalStudents">0</strong>
          </div>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="নাম, রোল বা মোবাইল দিয়ে খুঁজুন..." />
            <i class="fas fa-search"></i>
          </div>
        </div>

        <!-- Student Table (Desktop) -->
        <div class="student-table-wrapper">
          <table class="student-table">
            <thead>
              <tr>
                <th>রোল</th>
                <th>ছাত্র/ছাত্রীর নাম</th>
                <th>পিতার নাম</th>
                <th>মোবাইল</th>
                <th>যোগাযোগ</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <!-- Students will be loaded here -->
            </tbody>
          </table>
        </div>

        <!-- Student Cards (Mobile) -->
        <div class="student-cards" id="studentCards">
          <!-- Cards will be loaded here for mobile -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <i class="fas fa-user-slash"></i>
          <h3>কোন ছাত্র-ছাত্রী পাওয়া যায়নি</h3>
          <p>এই শ্রেণি ও শাখায় কোন ছাত্র-ছাত্রী নিবন্ধিত নেই।</p>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="pagination" style="display: none;">
          <!-- Pagination will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Auth Check Script -->
  <script src="auth-check.js"></script>

  <script type="module" src="./dist/call_student.js"></script>

</body>
</html>
