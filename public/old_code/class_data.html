<!doctype html>
<html lang="en">
<head>
	<meta charset="ut			iframe.id = 'datalist-preloader';
			iframe.style.display = 'none';
			iframe.src = '../0data/student_information.html';
			document.body.appendChild(iframe);>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Class Data</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
		body { font-family: 'Inter', system-ui, -apple-system, sans-serif; padding: 20px; background: #fdfdfd; background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px); background-size: 20px 20px; color: #1e293b; }
		
		#title { 
			background: white; padding: 20px; border-radius: 16px; 
			box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; 
			max-width: 800px; margin: 0 auto 20px; border: 1px solid #f1f5f9;
			font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;
		}
		
		.toolbar { 
			display: flex; gap: 15px; align-items: center; justify-content: center;
			margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto;
		}
		
		.search { flex: 1; max-width: 500px; }
		.search input { 
			width: 100%; padding: 12px 20px; border: 1px solid #e2e8f0; 
			border-radius: 30px; outline: none; background: white;
			font-size: 16px; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
		}
		.search input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
		
		.toggle-name { font-weight: 600; font-size: 14px; color: #64748b; display: flex; align-items: center; gap: 8px; cursor: pointer; }
		
		#status { 
			max-width: 800px; margin: 0 auto 15px; font-size: 14px; font-weight: 600; 
			color: #64748b; display: flex; align-items: center; gap: 8px;
		}
		
		#table-wrap { max-width: 800px; margin: 0 auto; }
		
		.card { 
			display: flex; align-items: center; background: white; border-radius: 20px; 
			padding: 20px 22px; margin-bottom: 18px; border: 1px solid rgba(226, 232, 240, 0.7); 
			cursor: pointer; transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
			box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
		}
		.card:hover { 
			transform: translateY(-5px); 
			box-shadow: 0 15px 40px rgba(99, 102, 241, 0.08), 0 5px 15px rgba(0, 0, 0, 0.05);
			border-color: rgba(99, 102, 241, 0.2);
		}
		.card:active { transform: scale(0.98); }
		
		.card .left { display: flex; flex-direction: column; align-items: center; min-width: 90px; }
		.avatar-initials { 
			width: 68px; height: 68px; border-radius: 16px; 
			display: flex; align-items: center; justify-content: center;
			background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
			color: #334155; font-weight: 800; font-size: 20px; 
			border: 2.5px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 8px;
		}
		.class-label { font-size: 11px; font-weight: 800; color: #94a3b8; letter-spacing: 0.5px; text-transform: uppercase; }
		
		.card .center { flex: 1; padding: 0 24px; }
		.card .center .title { 
			font-size: 24px; font-weight: 850; color: #0f172a; line-height: 1.2; 
			text-transform: uppercase; margin-bottom: 8px; letter-spacing: -0.4px;
		}
		.card .center .sub { font-size: 15px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 4px; }
		.card .center .meta { font-size: 13px; margin-top: 12px; color: #94a3b8; font-weight: 500; display: flex; align-items: center; }
		.session { color: #475569; font-weight: 800; margin-left: auto; padding: 4px 12px; background: #f1f5f9; border-radius: 8px; font-size: 13px; letter-spacing: 0.5px; }
		.yr-2025 { background: #fee2e2; color: #ef4444; }
		.yr-2026 { background: #e0e7ff; color: #4338ca; }
		
		.card .right { text-align: right; min-width: 90px; }
		.roll-label { display: block; font-size: 12px; font-weight: 800; color: #94a3b8; margin-bottom: 2px; letter-spacing: 1.5px; }
		.roll-value { font-size: 40px; font-weight: 900; color: #1e293b; line-height: 1; letter-spacing: -1px; }
		
		/* Themed Gradients for avatar accent */
		.card:nth-child(5n+1) .avatar-initials { background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%); color: #4338ca; }
		.card:nth-child(5n+2) .avatar-initials { background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%); color: #15803d; }
		.card:nth-child(5n+3) .avatar-initials { background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%); color: #a16207; }
		.card:nth-child(5n+4) .avatar-initials { background: linear-gradient(135deg, #ffedd5 0%, #fed7aa 100%); color: #c2410c; }
		.card:nth-child(5n+5) .avatar-initials { background: linear-gradient(135deg, #fae8ff 0%, #f5d0fe 100%); color: #a21caf; }
		
		@media (max-width: 600px) {
			body { padding: 12px; }
			.card { padding: 22px 16px; border-radius: 20px; }
			.card .center { padding: 0 16px; }
			.card .center .title { font-size: 20px; }
			.roll-value { font-size: 34px; }
			.avatar-initials { width: 56px; height: 56px; font-size: 18px; }
		}
		
		#active-info { display: none !important; }
	</style>
</head>
<body>
	<h2 id="title">Feni Model High School</h2>
	<div id="active-info" class="active-compact">Active: <span id="active-values">—</span></div>
	<div class="toolbar">
		<div class="search"><input id="search" type="text" placeholder="Search..."></div>
		<label class="toggle-name"><input id="show-name" type="checkbox"> student name</label>
	</div>
	<div id="status">Loading...</div>
	<div id="table-wrap"></div>

	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	<script src="auth-check.js"></script>
	<script type="module" src="./dist/class_data.js"></script>

</body>
</html>
