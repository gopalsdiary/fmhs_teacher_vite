<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <title>Attendance History</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 25px 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-left h1 {
      color: #2d3748;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header-left .subtitle {
      color: #718096;
      font-size: 14px;
    }

    .back-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    /* Main Content */
    .main-content {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    /* Date Filter */
    .filter-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      gap: 15px;
      align-items: end;
      flex-wrap: wrap;
      border: 2px solid #e2e8f0;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .filter-group input {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .filter-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .filter-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 30px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    /* Table Styles */
    .attendance-table-container {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .attendance-table {
      width: 100%;
      border-collapse: collapse;
    }

    .attendance-table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .attendance-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
    }

    .attendance-table tbody tr {
      border-bottom: 1px solid #e2e8f0;
      transition: background 0.2s ease;
    }

    .attendance-table tbody tr:hover {
      background: #f7fafc;
    }

    .attendance-table td {
      padding: 15px;
      font-size: 14px;
      color: #4a5568;
    }

    /* Status Badges */
    .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .status-present {
      background: #c6f6d5;
      color: #22543d;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }

    .loading i {
      font-size: 48px;
      margin-bottom: 20px;
      animation: spin 1s linear infinite;
      color: #667eea;
    }

    .loading p {
      font-size: 16px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #718096;
    }

    .empty-state i {
      font-size: 72px;
      margin-bottom: 25px;
      color: #cbd5e0;
    }

    .empty-state h3 {
      color: #4a5568;
      margin-bottom: 12px;
      font-size: 20px;
    }

    .empty-state p {
      color: #718096;
      font-size: 15px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        text-align: center;
      }

      .header-left h1 {
        font-size: 22px;
      }

      .filter-section {
        flex-direction: column;
      }

      .filter-group {
        width: 100%;
      }

      .filter-btn {
        width: 100%;
        justify-content: center;
      }

      .attendance-table {
        font-size: 12px;
      }

      .attendance-table th,
      .attendance-table td {
        padding: 10px;
      }
    }

    /* Summary Stats */
    .summary-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease;
    }

    .summary-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .summary-card .icon {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .summary-card.total .icon {
      color: #667eea;
    }

    .summary-card.students .icon {
      color: #48bb78;
    }

    .summary-card.average .icon {
      color: #ed8936;
    }

    .summary-card .number {
      font-size: 36px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .summary-card .label {
      color: #718096;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1><i class="fas fa-chart-line"></i> Attendance History</h1>
        <div class="subtitle">
          Teacher: <span id="teacherEmail">Loading...</span> | 
          Class: <span id="teacherClass">-</span> | 
          Section: <span id="teacherSection">-</span>
        </div>
      </div>
      <a href="teacher_dashboard.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
      </a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Filter Section -->
      <div class="filter-section">
        <div class="filter-group">
          <label><i class="fas fa-calendar-alt"></i> From Date</label>
          <input type="date" id="teacherFromDate" />
        </div>
        <div class="filter-group">
          <label><i class="fas fa-calendar-alt"></i> To Date</label>
          <input type="date" id="teacherToDate" />
        </div>
        <button class="filter-btn" onclick="loadTeacherHistory()">
          <i class="fas fa-search"></i> Search History
        </button>
      </div>

      <!-- Summary Cards -->
      <div id="summarySection" style="display: none;">
        <div class="summary-section">
          <div class="summary-card total">
            <div class="icon"><i class="fas fa-calendar-check"></i></div>
            <div class="number" id="totalDays">0</div>
            <div class="label">Total Days</div>
          </div>
          <div class="summary-card students">
            <div class="icon"><i class="fas fa-users"></i></div>
            <div class="number" id="totalStudents">0</div>
            <div class="label">Total Students</div>
          </div>
          <div class="summary-card average">
            <div class="icon"><i class="fas fa-percentage"></i></div>
            <div class="number" id="avgAttendance">0%</div>
            <div class="label">Average Attendance</div>
          </div>
        </div>
      </div>

      <!-- History Content -->
      <div id="teacherHistoryContent">
        <div class="loading">
          <i class="fas fa-spinner"></i>
          <p>Loading your attendance history...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-check.js"></script>
  <script type="module" src="./dist/attendence_class.js"></script>
  <script>

    }

    // Load Teacher History
    async function loadTeacherHistory() {
      const fromDate = document.getElementById('teacherFromDate').value;
      const toDate = document.getElementById('teacherToDate').value;
      const content = document.getElementById('teacherHistoryContent');
      const summarySection = document.getElementById('summarySection');

      content.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading history...</p></div>';
      summarySection.style.display = 'none';

      try {
        // Get RFID attendance data for teacher's class/section
        if (!teacherData.access_class || !teacherData.access_section) {
          content.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-exclamation-triangle"></i>
              <h3>No Class Assigned</h3>
              <p>Please contact admin to assign a class and section to your account</p>
            </div>
          `;
          return;
        }

        // Get students from teacher's class (handle multiple class-section assignments)
        let allFetchedStudents = [];
        
        if (teacherData.allAssignments && teacherData.allAssignments.length > 0) {
          // Fetch students for each specific class-section assignment
          for (const assignment of teacherData.allAssignments) {
            const { data: students, error: studError } = await window.authCheck.supabase
              .from('student_database')
              .select('rfid_card_no, iid, student_name_en')
              .eq('active_class', assignment.access_class)
              .eq('active_section', assignment.access_section);

            if (studError) throw studError;

            if (students) {
              allFetchedStudents = allFetchedStudents.concat(students);
            }
          }
        } else {
          // Single assignment - check if it's already a string or needs splitting
          let accessClass = teacherData.access_class;
          let accessSection = teacherData.access_section;
          
          // If it contains comma, split it, otherwise use as is
          if (typeof accessClass === 'string' && accessClass.includes(',')) {
            const classes = accessClass.split(',').map(c => c.trim()).filter(c => c);
            accessClass = classes[0];
          }
          if (typeof accessSection === 'string' && accessSection.includes(',')) {
            const sections = accessSection.split(',').map(s => s.trim()).filter(s => s);
            accessSection = sections[0];
          }
          
          const { data: students, error: studError } = await window.authCheck.supabase
            .from('student_database')
            .select('rfid_card_no, iid, student_name_en')
            .eq('active_class', accessClass)
            .eq('active_section', accessSection);

          if (studError) throw studError;
          allFetchedStudents = students || [];
        }

        // Remove duplicates based on iid
        const students = allFetchedStudents.filter((student, index, self) =>
          index === self.findIndex((s) => s.iid === student.iid)
        );

        if (!students || students.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-users-slash"></i>
              <h3>No Students Found</h3>
              <p>No students are enrolled in your assigned classes</p>
            </div>
          `;
          return;
        }

        const rfidCards = students.map(s => s.rfid_card_no).filter(r => r);

        if (rfidCards.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-id-card"></i>
              <h3>No RFID Cards Assigned</h3>
              <p>Students in your class don't have RFID cards assigned yet. Please contact admin.</p>
            </div>
          `;
          return;
        }

        // Get attendance data
        let query = window.authCheck.supabase
          .from('attendence_entry')
          .select('attendence_date, rfid_card_no')
          .in('rfid_card_no', rfidCards)
          .order('attendence_date', { ascending: false });

        if (fromDate) query = query.gte('attendence_date', fromDate);
        if (toDate) query = query.lte('attendence_date', toDate);

        const { data, error } = await query;

        if (error) throw error;

        if (!data || data.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-clipboard-list"></i>
              <h3>No Records Found</h3>
              <p>No RFID attendance records for your class in the selected date range</p>
            </div>
          `;
          return;
        }

        // Group by date and count unique students
        const groupedData = {};
        data.forEach(record => {
          const date = record.attendence_date;
          if (!groupedData[date]) {
            groupedData[date] = new Set();
          }
          groupedData[date].add(record.rfid_card_no);
        });

        // Calculate summary statistics
        const totalDays = Object.keys(groupedData).length;
        const totalStudents = students.length;
        let totalPercentage = 0;

        Object.values(groupedData).forEach(rfidSet => {
          const scanned = rfidSet.size;
          totalPercentage += (scanned / totalStudents) * 100;
        });

        const avgAttendance = totalDays > 0 ? (totalPercentage / totalDays).toFixed(1) : 0;

        // Update summary cards
        document.getElementById('totalDays').textContent = totalDays;
        document.getElementById('totalStudents').textContent = totalStudents;
        document.getElementById('avgAttendance').textContent = avgAttendance + '%';
        summarySection.style.display = 'block';

        // Render detailed table
        let tableHTML = `
          <div class="attendance-table-container">
            <table class="attendance-table">
              <thead>
                <tr>
                  <th><i class="fas fa-calendar"></i> Date</th>
                  <th><i class="fas fa-chalkboard"></i> Class</th>
                  <th><i class="fas fa-layer-group"></i> Section</th>
                  <th><i class="fas fa-user-check"></i> Students Scanned</th>
                  <th><i class="fas fa-users"></i> Total Students</th>
                  <th><i class="fas fa-chart-pie"></i> Attendance %</th>
                </tr>
              </thead>
              <tbody>
        `;

        // Sort dates in descending order
        const sortedDates = Object.keys(groupedData).sort((a, b) => new Date(b) - new Date(a));

        sortedDates.forEach(date => {
          const rfidSet = groupedData[date];
          const scanned = rfidSet.size;
          const total = students.length;
          const percentage = ((scanned / total) * 100).toFixed(1);
          
          tableHTML += `
            <tr>
              <td><strong>${formatDate(date)}</strong></td>
              <td>${teacherData.access_class}</td>
              <td>${teacherData.access_section}</td>
              <td><span class="status-badge status-present">${scanned} students</span></td>
              <td>${total} students</td>
              <td><strong>${percentage}%</strong></td>
            </tr>
          `;
        });

        tableHTML += `
              </tbody>
            </table>
          </div>
        `;

        content.innerHTML = tableHTML;

      } catch (error) {
        console.error('Error loading teacher history:', error);
        content.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle"></i>
            <h3>Error Loading Data</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
