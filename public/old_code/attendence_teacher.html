<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <title>My Attendance History</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 25px 30px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-left h1 {
      color: #2d3748;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header-left .subtitle {
      color: #718096;
      font-size: 14px;
    }

    .back-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    /* Messages */
    .success-message {
      background: #c6f6d5;
      color: #22543d;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .success-message.show {
      display: flex;
    }

    .error-message {
      background: #fed7d7;
      color: #742a2a;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .error-message.show {
      display: flex;
    }

    /* Content Container */
    .content-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    /* Stats Cards */
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #718096;
      font-size: 14px;
      font-weight: 500;
    }

    .stat-icon {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .stat-card.info .stat-icon {
      color: #667eea;
    }

    .stat-card.total .stat-icon {
      color: #667eea;
    }

    /* Filter Section */
    .filter-section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: end;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 200px;
    }

    .filter-group label {
      display: block;
      color: #4a5568;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .filter-group input {
      width: 100%;
      padding: 10px 15px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .filter-group input:focus {
      outline: none;
      border-color: #667eea;
    }

    .filter-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    /* Table */
    .attendance-table-container {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .attendance-table {
      width: 100%;
      border-collapse: collapse;
    }

    .attendance-table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .attendance-table th {
      padding: 15px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
    }

    .attendance-table tbody tr {
      border-bottom: 1px solid #e2e8f0;
      transition: background 0.2s ease;
    }

    .attendance-table tbody tr:hover {
      background: #f7fafc;
    }

    .attendance-table td {
      padding: 15px;
      font-size: 14px;
      color: #4a5568;
    }

    /* Status Badges */
    .entry-in {
      background: #dcfce7;
      color: #166534;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      display: inline-block;
    }

    .entry-out {
      background: #fef2f2;
      color: #dc2626;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      display: inline-block;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
    }

    .loading i {
      font-size: 40px;
      margin-bottom: 15px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }

    .empty-state i {
      font-size: 60px;
      margin-bottom: 20px;
      color: #cbd5e0;
    }

    .empty-state h3 {
      color: #4a5568;
      margin-bottom: 10px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header {
        text-align: center;
      }

      .header-left h1 {
        font-size: 22px;
      }

      .attendance-table {
        font-size: 12px;
      }

      .attendance-table th,
      .attendance-table td {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1><i class="fas fa-user-clock"></i> My Attendance History</h1>
        <div class="subtitle">
          Teacher: <span id="teacherEmail">Loading...</span>
        </div>
      </div>
      <a href="teacher_dashboard.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
      </a>
    </div>

    <!-- Messages -->
    <div id="successMessage" class="success-message">
      <i class="fas fa-check-circle"></i>
      <span id="successText"></span>
    </div>

    <div id="errorMessage" class="error-message">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorText"></span>
    </div>

    <!-- Content Container -->
    <div class="content-container">
      <!-- Teacher Info Stats -->
      <div id="teacherInfoStats" style="display: none;">
        <div class="stats-container">
          <div class="stat-card info">
            <div class="stat-icon"><i class="fas fa-id-card"></i></div>
            <div class="stat-label">Teacher ID</div>
            <div class="stat-number" style="font-size: 18px;" id="teacherIID">-</div>
          </div>
          <div class="stat-card info">
            <div class="stat-icon"><i class="fas fa-credit-card"></i></div>
            <div class="stat-label">RFID Card</div>
            <div class="stat-number" style="font-size: 16px;" id="teacherRFID">-</div>
          </div>
          <div class="stat-card total">
            <div class="stat-icon"><i class="fas fa-clipboard-list"></i></div>
            <div class="stat-label">Total Records</div>
            <div class="stat-number" id="totalRecords">0</div>
          </div>
        </div>
      </div>

      <!-- Date Filter -->
      <div class="filter-section">
        <div class="filter-group">
          <label><i class="fas fa-calendar"></i> From Date (Optional)</label>
          <input type="date" id="fromDate" />
        </div>
        <div class="filter-group">
          <label><i class="fas fa-calendar"></i> To Date (Optional)</label>
          <input type="date" id="toDate" />
        </div>
        <button class="filter-btn" onclick="loadAttendance()">
          <i class="fas fa-search"></i> Load Attendance
        </button>
      </div>

      <!-- Attendance Content -->
      <div id="attendanceContent">
        <div class="loading">
          <i class="fas fa-spinner"></i>
          <p>Loading your attendance history...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Auth Check Script -->
  <script src="auth-check.js"></script>

  <script type="module" src="./dist/attendence_teacher.js"></script>
 <script>
  // Get RFID card from student_database using IID
        const { data: studentData, error: studentError } = await window.authCheck.supabase
          .from('student_database')
          .select('rfid_card_no')
          .eq('iid', teacherIID)
          .single();

        if (studentError) {
          console.error('Error fetching RFID from student_database:', studentError);
          showError('RFID card not found. Please ensure your ID is registered in the student_database.');
          document.getElementById('attendanceContent').innerHTML = `
            <div class="empty-state">
              <i class="fas fa-exclamation-triangle"></i>
              <h3>RFID Card Not Found</h3>
              <p>Your teacher ID (${teacherIID}) is not registered in the student database with an RFID card.</p>
              <p style="margin-top: 10px; font-size: 13px;">Please contact the admin to register your RFID card.</p>
            </div>
          `;
          return;
        }

        teacherRFID = studentData?.rfid_card_no;

        if (!teacherRFID) {
          showError('RFID card number is empty');
          document.getElementById('attendanceContent').innerHTML = `
            <div class="empty-state">
              <i class="fas fa-exclamation-triangle"></i>
              <h3>RFID Card Not Assigned</h3>
              <p>No RFID card is assigned to your account.</p>
              <p style="margin-top: 10px; font-size: 13px;">Please contact the admin to assign an RFID card.</p>
            </div>
          `;
          return;
        }

        console.log('Teacher RFID:', teacherRFID);

        // Update stats
        document.getElementById('teacherIID').textContent = teacherIID;
        document.getElementById('teacherRFID').textContent = teacherRFID;
        document.getElementById('teacherInfoStats').style.display = 'block';

        // Load attendance by default
        await loadAttendance();

        console.log('Initialization complete');

      } catch (error) {
        console.error('Error initializing:', error);
        showError('Error loading attendance system: ' + error.message);
      }
    }

    // Load Attendance
    async function loadAttendance() {
      const content = document.getElementById('attendanceContent');
      const fromDate = document.getElementById('fromDate').value;
      const toDate = document.getElementById('toDate').value;

      if (!teacherRFID) {
        showError('RFID card not found. Cannot load attendance.');
        return;
      }

      content.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Loading attendance records...</p></div>';

      try {
        // Build query
        let query = window.authCheck.supabase
          .from('attendence_entry')
          .select('*')
          .eq('rfid_card_no', teacherRFID)
          .order('attendence_date', { ascending: false })
          .order('attendence_time', { ascending: false });

        // Apply date filters if provided
        if (fromDate) query = query.gte('attendence_date', fromDate);
        if (toDate) query = query.lte('attendence_date', toDate);

        const { data, error } = await query;

        if (error) throw error;

        if (!data || data.length === 0) {
          const dateRangeMsg = (fromDate || toDate) ? 
            `<p style="margin-top: 10px; color: #718096; font-size: 13px;">
              No records found for the selected date range. Try removing the date filter.
            </p>` : 
            `<p style="margin-top: 10px; color: #718096; font-size: 13px;">
              You have not scanned your RFID card yet at any gate.
            </p>`;
          
          content.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-clipboard-list"></i>
              <h3>No Attendance Records</h3>
              <p>No attendance records found for your RFID card</p>
              ${dateRangeMsg}
            </div>
          `;
          document.getElementById('totalRecords').textContent = 0;
          return;
        }

        // Update total records
        document.getElementById('totalRecords').textContent = data.length;

        // Process attendance entries to determine IN/OUT status
        const processedData = [];
        const dailyEntries = {};
        
        // Group entries by date
        data.forEach(row => {
          const date = row.attendence_date || '';
          if (!dailyEntries[date]) dailyEntries[date] = [];
          dailyEntries[date].push(row);
        });
        
        // Process each date's entries
        Object.keys(dailyEntries).forEach(date => {
          const dayEntries = dailyEntries[date].sort((a, b) => {
            const timeA = a.attendence_time || '';
            const timeB = b.attendence_time || '';
            return timeA.localeCompare(timeB);
          });
          
          dayEntries.forEach((entry, index) => {
            processedData.push({
              ...entry,
              entryStatus: index % 2 === 0 ? 'IN' : 'OUT'
            });
          });
        });

        // Sort processed data (newest first)
        processedData.sort((a, b) => {
          const dateA = a.attendence_date || '';
          const dateB = b.attendence_date || '';
          if (dateA !== dateB) return dateB.localeCompare(dateA);
          const timeA = a.attendence_time || '';
          const timeB = b.attendence_time || '';
          return timeB.localeCompare(timeA);
        });

        // Render table
        let tableHTML = `
          <div class="attendance-table-container">
            <table class="attendance-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Date</th>
                  <th>Time</th>
                  <th>Status</th>
                  <th>Device/Location</th>
                </tr>
              </thead>
              <tbody>
        `;

        processedData.forEach((record, idx) => {
          const date = record.attendence_date || '';
          const time = record.attendence_time || '';
          const status = record.entryStatus;
          const statusClass = status === 'IN' ? 'entry-in' : 'entry-out';
          const device = record.device_location || 'Main Gate';
          
          tableHTML += `
            <tr>
              <td><strong>${idx + 1}</strong></td>
              <td>${formatDate(date)}</td>
              <td><strong>${formatTime(time)}</strong></td>
              <td><span class="${statusClass}">${status}</span></td>
              <td>${device}</td>
            </tr>
          `;
        });

        tableHTML += `
              </tbody>
            </table>
          </div>
        `;

        content.innerHTML = tableHTML;

      } catch (error) {
        console.error('Error loading attendance:', error);
        content.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle"></i>
            <h3>Error Loading Data</h3>
            <p>${error.message}</p>
          </div>
        `;
      }
    }

    // Format date helper
    function formatDate(dateStr) {
      try {
        return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
      } catch {
        return dateStr;
      }
    }

    // Format time helper
    function formatTime(timeStr) {
      try {
        return new Date('1970-01-01T' + timeStr).toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true
        });
      } catch {
        return timeStr;
      }
    }

    // Show Success Message
    function showSuccess(message) {
      const successMsg = document.getElementById('successMessage');
      document.getElementById('successText').textContent = message;
      successMsg.classList.add('show');
      setTimeout(() => {
        successMsg.classList.remove('show');
      }, 5000);
    }

    // Show Error Message
    function showError(message) {
      const errorMsg = document.getElementById('errorMessage');
      document.getElementById('errorText').textContent = message;
      errorMsg.classList.add('show');
      setTimeout(() => {
        errorMsg.classList.remove('show');
      }, 5000);
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
